name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release Executable
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish App
      run: |
        dotnet publish src/Space.Map.App/Space.Map.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o publish

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          publish/Space.Map.exe
        draft: false
        prerelease: false
        generate_release_notes: true
