name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore Dependencies
      run: dotnet restore Space.Map.slnx

    - name: Build Solution
      run: dotnet build Space.Map.slnx --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test Space.Map.slnx --configuration Release --no-build --verbosity normal
